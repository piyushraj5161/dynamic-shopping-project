<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shopping Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🛒 Dynamic Shopping Store</h1>
    <p>Find Your Favourite Products</p>
</header>

<main class="container">

    <div class="controls">
        <input type="text" id="searchInput"
        placeholder="Search products...">

        <select id="categoryFilter">
            <option value="all">All Categories</option>
        </select>

        <select id="sortSelect">
            <option value="default">Default Sorting</option>
            <option value="low">Price Low to High</option>
            <option value="high">Price High to Low</option>
        </select>
    </div>

    <p id="loading">Loading Products...</p>
    <p id="errorMessage"></p>

    <h2>Products</h2>
    <section id="productContainer" class="products"></section>

    <h2>🛍️ Shopping Cart</h2>
    <div id="cartContainer"></div>
    <h3 id="cartTotal">Total: $0</h3>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
